<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE HIT — Arcade Cabinet 01</title>
<style>
  :root{
    --bg:#1a1210; --bezel:#2b1620; --screen:#0d0806;
    --text:#e8dfd6; --text-muted:#a89890; --text-faint:#6e5f58;
    --gold:#f0b429; --red:#e0483e; --cyan:#5ad1e6;
    --font-display:"SFMono-Regular",Menlo,"IBM Plex Mono",Consolas,monospace;
    --font-serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-display);padding:36px 20px 70px;display:flex;flex-direction:column;align-items:center;}
  .eyebrow{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
  h1{font-family:var(--font-serif);font-weight:400;font-size:26px;margin:0 0 6px;letter-spacing:0.02em;}
  .tagline{font-size:12.5px;color:var(--text-muted);margin:0 0 26px;max-width:420px;text-align:center;line-height:1.6;}

  .cabinet{
    background:var(--bezel);
    border-radius:16px;
    padding:16px 16px 20px;
    box-shadow:inset 0 0 0 1px rgba(240,180,41,0.15);
  }
  .hud{
    display:flex; justify-content:space-between; gap:14px;
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text-muted); padding:0 4px 10px;
  }
  .hud b{color:var(--gold); font-size:15px; letter-spacing:0.02em;}
  .screen-wrap{ position:relative; border-radius:6px; overflow:hidden; }
  canvas{ display:block; background:var(--screen); }
  .scanlines{
    position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      transparent 1px, transparent 3px
    );
  }
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(13,8,6,0.86); gap:10px; padding:20px;
  }
  .overlay.hidden{ display:none; }
  .overlay .big{ font-family:var(--font-serif); font-size:24px; color:var(--gold); }
  .overlay .stat{ font-size:12.5px; color:var(--text-muted); }
  .overlay .stat b{ color:var(--text); }
  .overlay .hint{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:8px; }
  .controls-note{
    margin-top:16px; font-size:11px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.06em;
  }
</style>
</head>
<body>
  <p class="eyebrow">The Arcade Cabinet — game 01</p>
  <h1>ONE HIT</h1>
  <p class="tagline">One life. One touch ends it. Every second you survive, the room gets busier — see how close you can cut it.</p>

  <div class="cabinet">
    <div class="hud">
      <div>Time <b id="hudTime">0.0</b>s</div>
      <div>Near misses <b id="hudNear">0</b></div>
      <div>Best <b id="hudBest">0.0</b>s</div>
    </div>
    <div class="screen-wrap">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div class="scanlines"></div>
      <div class="overlay" id="overlay">
        <div class="big">ONE HIT</div>
        <div class="stat">Move with arrow keys or WASD. Don't get touched.</div>
        <div class="hint">Click or press any move key to start</div>
      </div>
    </div>
  </div>
  <p class="controls-note">↑↓←→ / WASD to move</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 400, H = 400;
const overlay = document.getElementById('overlay');
const hudTime = document.getElementById('hudTime');
const hudNear = document.getElementById('hudNear');
const hudBest = document.getElementById('hudBest');

const PLAYER_R = 7;
const PLAYER_SPEED = 190; // px/sec
const NEAR_MISS_MARGIN = 10;

let state = 'ready'; // ready | playing | over
let player, bullets, keys, startTime, lastTime, nearMisses, best = 0;
let spawnTimer, flashes;

function resetGame(){
  player = { x: W/2, y: H/2 };
  bullets = [];
  keys = {};
  nearMisses = 0;
  flashes = [];
  spawnTimer = 0;
  startTime = performance.now();
  lastTime = startTime;
}

function spawnBullet(elapsedSec){
  const speed = 70 + Math.min(160, elapsedSec * 9);
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){ x = Math.random()*W; y = -10; }
  else if(side===1){ x = W+10; y = Math.random()*H; }
  else if(side===2){ x = Math.random()*W; y = H+10; }
  else { x = -10; y = Math.random()*H; }
  const dx = player.x - x, dy = player.y - y;
  const d = Math.sqrt(dx*dx+dy*dy) || 1;
  bullets.push({ x, y, vx:(dx/d)*speed, vy:(dy/d)*speed, r:5, near:false });
}

function update(dt, elapsedSec){
  let mx=0, my=0;
  if(keys['ArrowUp']||keys['w']||keys['W']) my -= 1;
  if(keys['ArrowDown']||keys['s']||keys['S']) my += 1;
  if(keys['ArrowLeft']||keys['a']||keys['A']) mx -= 1;
  if(keys['ArrowRight']||keys['d']||keys['D']) mx += 1;
  if(mx!==0 || my!==0){
    const len = Math.sqrt(mx*mx+my*my);
    player.x += (mx/len)*PLAYER_SPEED*dt;
    player.y += (my/len)*PLAYER_SPEED*dt;
  }
  player.x = Math.max(PLAYER_R, Math.min(W-PLAYER_R, player.x));
  player.y = Math.max(PLAYER_R, Math.min(H-PLAYER_R, player.y));

  const spawnInterval = Math.max(0.18, 0.85 - elapsedSec*0.012);
  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnBullet(elapsedSec);
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    const dx = b.x-player.x, dy = b.y-player.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < PLAYER_R + b.r){
      endGame(elapsedSec);
      return;
    }
    if(!b.near && dist < PLAYER_R + b.r + NEAR_MISS_MARGIN){
      b.near = true;
      nearMisses++;
      flashes.push({x:b.x, y:b.y, life:0.25});
    }
    if(b.x < -30 || b.x > W+30 || b.y < -30 || b.y > H+30){
      bullets.splice(i,1);
    }
  }
  for(let i=flashes.length-1;i>=0;i--){
    flashes[i].life -= dt;
    if(flashes[i].life<=0) flashes.splice(i,1);
  }
}

function draw(){
  ctx.fillStyle = '#0d0806';
  ctx.fillRect(0,0,W,H);

  for(const f of flashes){
    const t = f.life/0.25;
    ctx.strokeStyle = `rgba(232,223,214,${t.toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 12*(1.6-t), 0, Math.PI*2); ctx.stroke();
  }

  for(const b of bullets){
    const tailX = b.x - b.vx*0.03, tailY = b.y - b.vy*0.03;
    ctx.strokeStyle = 'rgba(90,209,230,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.fillStyle = '#5ad1e6';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = '#f0b429';
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(Math.PI/4);
  ctx.fillRect(-PLAYER_R, -PLAYER_R, PLAYER_R*2, PLAYER_R*2);
  ctx.restore();
}

function loop(now){
  if(state !== 'playing'){ return; }
  const dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;
  const elapsedSec = (now-startTime)/1000;
  update(dt, elapsedSec);
  if(state !== 'playing') return;
  draw();
  hudTime.textContent = elapsedSec.toFixed(1);
  hudNear.textContent = nearMisses;
  requestAnimationFrame(loop);
}

function startGame(){
  if(state === 'playing') return;
  resetGame();
  state = 'playing';
  overlay.classList.add('hidden');
  requestAnimationFrame(loop);
}

function endGame(elapsedSec){
  state = 'over';
  if(elapsedSec > best){ best = elapsedSec; hudBest.textContent = best.toFixed(1); }
  draw();
  overlay.innerHTML = `
    <div class="big">GAME OVER</div>
    <div class="stat">Survived <b>${elapsedSec.toFixed(1)}s</b></div>
    <div class="stat">Near misses: <b>${nearMisses}</b></div>
    <div class="stat">Best this session: <b>${best.toFixed(1)}s</b></div>
    <div class="hint">Click or press a move key to try again</div>
  `;
  overlay.classList.remove('hidden');
}

window.addEventListener('keydown', (e)=>{
  keys[e.key] = true;
  if(state !== 'playing' && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){
    startGame();
  }
});
window.addEventListener('keyup', (e)=>{ keys[e.key] = false; });
overlay.addEventListener('click', startGame);
canvas.addEventListener('click', startGame);

draw();
</script>
</body>
</html>
