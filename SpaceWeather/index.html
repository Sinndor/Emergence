<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div class="wrap">
    <header class="top">
      <div class="mark">
        <span class="mark-dot" id="mark-dot"></span>
        <span class="mark-text">AURORA WATCH</span>
      </div>
      <p class="tagline">Geomagnetic activity and your local sky, read together — can you actually see it tonight?</p>
    </header>

    <form class="query" id="query-form">
      <label class="query-label" for="place">WHERE</label>
      <input class="query-input" id="place" name="place"
             placeholder="Zip code or city name" autocomplete="off" required />
      <button class="query-submit" type="submit" id="submit-btn">Check tonight</button>
    </form>

    <div class="status-line" id="status-line" aria-live="polite"></div>

    <main class="panels" id="panels" hidden>
      <section class="panel" id="panel-geo" data-panel="geo">
        <div class="panel-eyebrow">SUN &amp; MAGNETOSPHERE</div>
        <div class="panel-main">
          <div class="reading" id="kp-value">—</div>
          <div class="reading-unit">KP INDEX</div>
        </div>
        <div class="panel-category" id="kp-category">—</div>
        <div class="panel-detail" id="kp-detail">—</div>
      </section>

      <section class="panel" id="panel-sky" data-panel="sky">
        <div class="panel-eyebrow">YOUR SKY TONIGHT</div>
        <div class="panel-main">
          <div class="reading" id="cloud-value">—</div>
          <div class="reading-unit">% CLOUD COVER</div>
        </div>
        <div class="panel-category" id="cloud-category">—</div>
        <div class="panel-detail" id="cloud-detail">—</div>
      </section>
    </main>

    <div class="verdict" id="verdict" hidden>
      <div class="verdict-label">TONIGHT'S CALL</div>
      <div class="verdict-text" id="verdict-text">—</div>
    </div>

    <footer class="foot">
      <span id="updated-at">Not checked yet</span>
      <span class="foot-sep">·</span>
      <span>Data: NOAA Space Weather Prediction Center, Open-Meteo</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
